<!DOCTYPE html>
<html lang="pt-BR" class="dark" style='--font-sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;'>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF5F24">
  <title>Acesso à Plataforma · Aprov Black</title>
  <meta name="description" content="Acesse o ecossistema exclusivo de crédito PJ, esteira e diagnósticos SCR Bacen da Aprov Black.">
  
  <link rel="stylesheet" href="../backoffice/css/dashboard-official.css">
  <link rel="stylesheet" href="../backoffice/css/styles.css">
  
  <style>
    body {
      background-color: #050505;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .brand-orange { color: #FF5F24; }
    .bg-brand-orange { background-color: #FF5F24; }
  </style>
</head>
<body class="relative isolate overflow-hidden">

  <!-- BACKGROUND DECORATIONS (EXATO HC CLUB) -->
  <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
    <div class="dashboard-grid-background"></div>
    <div class="dashboard-mouse-glow is-visible" style="transform:translateX(50vw) translateY(30vh)"></div>
    <div class="grain-texture"></div>
  </div>

  <div class="relative z-10 w-full max-w-md p-6 sm:p-8">
    <!-- LOGO HEADER -->
    <div class="flex flex-col items-center mb-8 text-center">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-[#FF5F24] to-[#d94811] flex items-center justify-center font-black text-white text-2xl shadow-[0_0_25px_rgba(255,95,36,0.5)] mb-3">
        A
      </div>
      <h2 class="font-black text-2xl tracking-tight text-white">APROV <span class="text-brand-orange">BLACK</span></h2>
      <p class="text-xs text-gray-400 mt-1">Plataforma Exclusiva de Crédito PJ & Diagnósticos SCR</p>
    </div>

    <!-- LOGIN CARD (ESTILO HC CLUB) -->
    <div class="rounded-[28px] border border-white/10 bg-[#0d0d0d]/90 backdrop-blur-xl p-7 shadow-[0_20px_50px_rgba(0,0,0,0.8)]">
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1.5">E-mail ou CNPJ</label>
          <input type="text" id="loginEmail" required value="danylo@aprovblack.com.br" placeholder="seu.email@empresa.com.br" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-brand-orange transition" />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-semibold text-gray-300">Senha de Acesso</label>
            <a href="#" onclick="alert('Instruções de recuperação foram enviadas para seu e-mail cadastrado.'); return false;" class="text-[11px] text-brand-orange hover:underline">Esqueci a senha</a>
          </div>
          <input type="password" id="loginPass" required value="••••••••" placeholder="Sua senha secreta" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-brand-orange transition" />
        </div>

        <div class="pt-2">
          <button type="submit" id="btnSubmit" class="btn-liquid w-full text-white rounded-xl py-3.5 px-4 text-sm font-bold shadow-[0_0_20px_rgba(255,95,36,0.3)] flex items-center justify-center gap-2">
            Entrar no Backoffice Black →
          </button>
        </div>
      </form>

      <div class="mt-6 pt-5 border-t border-white/5 text-center">
        <span class="text-xs text-gray-500">Credenciais criptografadas de ponta a ponta</span>
        <div class="mt-3">
          <a href="../index.html" class="text-xs text-gray-400 hover:text-white transition">
            ← Voltar para a Página Principal
          </a>
        </div>
      </div>
    </div>

    <!-- FOOTER INFO -->
    <div class="text-center mt-6 text-xs text-gray-600">
      &copy; 2026 Aprov Black · Tecnologia e Inteligência em Crédito PJ
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = 'Autenticando...';
      btn.style.opacity = '0.7';

      setTimeout(() => {
        window.location.href = '../backoffice/index.html';
      }, 600);
    }
  </script>
</body>
</html>
